<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mockman — panel harness</title>
    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Renders the real built panel against a stubbed `chrome`, so the UI can be
      looked at (and driven) without installing the extension or opening
      DevTools. The stub is deliberately thin: it holds a workspace in memory and
      answers the same messages the service worker does, which is enough for
      every panel interaction except live network traffic — that is faked below
      by firing onRequestFinished on a timer.

      This is a harness for eyeballing and for smoke-testing, not a replacement
      for a real DevTools session. The manual pass in README.md still applies.
    -->
    <script>
      const INSPECTED_TAB_ID = 101;

      const folder = (id, name, children, over = {}) => ({
        kind: 'folder', id, name, enabled: true, tagIds: [], order: 0,
        expanded: true, children, ...over,
      });
      const mock = (id, name, method, urlPattern, over = {}) => ({
        kind: 'mock', id, name, enabled: true, tagIds: [], order: 0,
        match: { method, urlPattern, patternKind: 'glob' },
        response: { status: 200, headers: {}, body: '{\n  "ok": true\n}', bodyKind: 'json', delayMs: 0 },
        ...over,
      });

      let workspace = {
        version: 2,
        enabled: true,
        targetTabIds: [],
        tags: [
          { id: 'tag_a', name: 'slow', color: '#e5c07b', enabled: true },
          { id: 'tag_b', name: 'wip', color: '#c678dd', enabled: false },
        ],
        tree: [
          folder('f1', 'Web-edge-API', [
            folder('f2', 'Bar Rewards', [mock('m1', 'List rewards', 'GET', '*/api/rewards')]),
            folder('f3', 'Locations', [mock('m2', 'Nearby', 'GET', '*/api/locations/nearby')]),
            folder('f4', 'Jukeboxes', [
              folder('f5', 'Filters', [mock('m3', 'Genres', 'GET', '*/api/genres')]),
              folder('f6', 'Settings', [
                mock('m4', 'Get Settings', 'GET', '*/api/jukeboxes/settings'),
                mock('m5', 'Save Settings', 'POST', '*/api/jukeboxes/settings', {
                  label: 'evalx',
                  tagIds: ['tag_a'],
                  response: {
                    status: 200, headers: { 'x-via': 'mockman' },
                    body: JSON.stringify({ 'tempo-uptime-score': { flagVersion: 34, value: true, variation: 0 } }, null, 2),
                    bodyKind: 'json', delayMs: 0,
                  },
                }),
              ]),
              mock('m6', 'Device status', 'GET', '*/api/jukeboxes/*/status', { tagIds: ['tag_b'] }),
            ]),
            folder('f7', 'Operators', [], { enabled: false }),
            mock('m7', 'Health', 'GET', '*/health'),
            mock('m8', 'Version', 'GET', '*/version'),
          ]),
        ],
      };

      // Renumber so `order` matches array position, the invariant the real
      // mutations maintain.
      (function renumber(nodes) {
        nodes.forEach((n, i) => { n.order = i; if (n.kind === 'folder') renumber(n.children); });
      })(workspace.tree);

      const listeners = [];
      const broadcast = (message) => listeners.forEach((fn) => fn(message));

      // A HAR entry as chrome.devtools.network reports one. `_resourceType` and
      // `content.mimeType` are what the filter bar reads, so both are included.
      // `contentMime` defaults to the header's value; pass '' for it to model a
      // bodiless response, where Chrome leaves content.mimeType empty and only
      // the header identifies the payload.
      const makeEntry = (method, url, status, body, resourceType, mimeType, contentMime = mimeType) => ({
        startedDateTime: new Date().toISOString(),
        _resourceType: resourceType,
        request: { method, url, postData: undefined },
        response: {
          status,
          headers: [{ name: 'content-type', value: mimeType }],
          content: { mimeType: contentMime, text: body },
        },
        getContent: (cb) => cb(body),
      });

      // Requests DevTools recorded BEFORE this panel was opened. They reach the
      // log only via getHAR() — which is the whole point: without seeding, a
      // panel opened mid-session shows almost nothing while Chrome's own
      // Network panel is full.
      const PRE_RECORDED = [
        makeEntry('OPTIONS', 'https://events.launchdarkly.example.com/events/bulk', 204, '', 'preflight', ''),
        makeEntry('POST', 'https://events.launchdarkly.example.com/events/bulk', 202, '{"ok":true}', 'fetch', 'application/json'),
        makeEntry('GET', 'https://test-web-edge-api.example.com/v2/jukeboxes/settings', 200, '{"settings":[]}', 'xhr', 'application/json'),
      ];

      let hitSeq = 0;
      const hits = [];

      window.chrome = {
        devtools: {
          inspectedWindow: { tabId: INSPECTED_TAB_ID },
          network: {
            onRequestFinished: {
              _listeners: [],
              addListener(fn) { this._listeners.push(fn); },
              removeListener(fn) { this._listeners = this._listeners.filter((f) => f !== fn); },
              _emit(entry) { this._listeners.forEach((fn) => fn(entry)); },
            },
            // Fired when the inspected page navigates; `_emit(url)` fakes a reload.
            onNavigated: {
              _listeners: [],
              addListener(fn) { this._listeners.push(fn); },
              removeListener(fn) { this._listeners = this._listeners.filter((f) => f !== fn); },
              _emit(url) { this._listeners.forEach((fn) => fn(url)); },
            },
            // What DevTools had already recorded before the panel opened.
            _har: PRE_RECORDED,
            getHAR(callback) {
              // `?har=throw` makes this fail the way a hostile host would, to
              // prove live capture does not depend on the seeding working.
              // `?har=junk` feeds it entries that cannot be read.
              const mode = new URLSearchParams(location.search).get('har');
              if (mode === 'throw') throw new Error('getHAR is unavailable');
              if (mode === 'junk') {
                setTimeout(() => callback({ entries: [null, {}, { request: {} }, ...this._har] }), 0);
                return;
              }
              setTimeout(() => callback({ entries: this._har }), 0);
            },
          },
        },
        runtime: {
          async sendMessage(message) {
            switch (message.type) {
              case 'get-workspace': return { type: 'workspace', workspace };
              case 'set-workspace':
                workspace = { ...message.workspace, targetTabIds: workspace.targetTabIds };
                setTimeout(() => broadcast({ type: 'workspace-changed', workspace }), 0);
                return { type: 'ok' };
              case 'set-target-tabs':
                workspace = { ...workspace, targetTabIds: [...new Set(message.tabIds)] };
                setTimeout(() => broadcast({ type: 'workspace-changed', workspace }), 0);
                return { type: 'ok' };
              case 'get-hits':
                return { type: 'hits', hits: hits.filter((h) => message.tabId === undefined || h.tabId === message.tabId) };
              case 'clear-hits':
                hits.length = 0;
                return { type: 'ok' };
              default: return { type: 'ok' };
            }
          },
          onMessage: {
            addListener(fn) { listeners.push(fn); },
            removeListener(fn) { const i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1); },
          },
          connect() {
            // The panel's lifetime port. Connecting targets the inspected tab,
            // exactly as the service worker does.
            return {
              postMessage(message) {
                if (message?.type !== 'panel-hello') return;
                workspace = { ...workspace, targetTabIds: [...new Set([...workspace.targetTabIds, message.tabId])] };
                setTimeout(() => broadcast({ type: 'workspace-changed', workspace }), 0);
              },
              disconnect() {},
              onDisconnect: { addListener() {} },
            };
          },
        },
      };

      // Traffic that happens *after* the panel opened, reaching the log through
      // onRequestFinished — the other half of the picture from PRE_RECORDED.
      setTimeout(() => {
        const net = chrome.devtools.network.onRequestFinished;
        const entry = makeEntry;
        const traffic = [
          ['GET', 'https://otel.observability.app.id.example.com/v1/metrics', 200, '{}', 'xhr', 'application/json'],
          ['GET', 'https://jenkins.example.com/view/job/PR-1/api/json', 200, '{"building":false}', 'fetch', 'application/json'],
          ['POST', 'https://stable.example.com/v2/jukeboxes/state/current', 401, '{"error":"nope"}', 'xhr', 'application/json'],
          ['GET', 'https://app.example.com/', 200, '<!doctype html>', 'document', 'text/html'],
          ['GET', 'https://app.example.com/assets/main.a1b2.css', 200, 'body{}', 'stylesheet', 'text/css'],
          ['GET', 'https://app.example.com/assets/vendor.9f8e.js', 200, 'void 0;', 'script', 'text/javascript'],
          ['GET', 'https://fonts.example.com/inter-latin.woff2', 200, '', 'font', 'font/woff2'],
          ['GET', 'https://cdn.example.com/artwork/album-4821.jpg', 200, '', 'image', 'image/jpeg'],
          ['GET', 'https://cdn.example.com/preview/track-118.mp3', 206, '', 'media', 'audio/mpeg'],
          ['GET', 'https://app.example.com/manifest.webmanifest', 200, '{}', 'manifest', 'application/manifest+json'],
          ['GET', 'wss://live.example.com/jukebox/socket', 101, '', 'websocket', ''],
          ['GET', 'https://app.example.com/decoder.wasm', 200, '', 'fetch', 'application/wasm'],
          ['GET', 'https://beacon.example.com/collect', 204, '', 'ping', 'text/plain'],

          // The cases that made the filter look broken against real traffic.
          // A CORS preflight has its own resource type and no body at all, so
          // neither `_resourceType` nor `content.mimeType` places it — yet it
          // is unmistakably API traffic and must land under Fetch/XHR.
          ['OPTIONS', 'https://stable-jukebox-main.example.com/v2/jukeboxes/state/current', 204, '', 'preflight', ''],
          // A resource type newer than this build: must fall through to the
          // mime heuristic rather than silently dropping into "Other".
          ['GET', 'https://id.example.com/accounts', 200, '{}', 'fedcm', 'application/json'],
          // No resource type at all, and no body — only the header identifies it.
          ['POST', 'https://api.example.com/graphql', 200, '', undefined, 'application/graphql-response+json', ''],
        ];
        for (const args of traffic) net._emit(entry(...args));

        // A request that was already in the HAR *and* arrives live, which is
        // what happens to anything finishing while getHAR() is in flight. It
        // must appear exactly once.
        net._emit(PRE_RECORDED[1]);

        const reportHit = (hit) => {
          const record = { id: `h${++hitSeq}`, tabId: INSPECTED_TAB_ID, timestamp: Date.now(), ...hit };
          hits.push(record);
          broadcast({ type: 'hit', hit: record });
        };

        reportHit({
          method: 'POST', url: 'https://stable-tempo.example.com/api/helpshift/v1/article/tempo',
          outcome: 'mocked', mockId: 'm5', path: 'Web-edge-API / Jukeboxes / Settings / Save Settings',
          label: 'evalx', status: 200,
        });

        // The bug this pairing exists for. DevTools reported the CORS preflight
        // (above, in `traffic`) but never the GET that caused it — so without the
        // interceptor's own record the log would show an OPTIONS row and nothing
        // else, which is exactly what it did.
        reportHit({
          method: 'GET',
          url: 'https://stable-jukebox-main.example.com/v2/jukeboxes/state/current',
          outcome: 'passed',
          status: 200,
        });

        // These two DevTools also reported, so each must be listed once, not
        // twice — the interceptor and DevTools both saw them.
        reportHit({ method: 'GET', url: 'https://jenkins.example.com/view/job/PR-1/api/json', outcome: 'passed', status: 200 });
        reportHit({ method: 'POST', url: 'https://stable.example.com/v2/jukeboxes/state/current', outcome: 'passed', status: 401 });

        // A request that died at the network level: no status exists, so this is
        // the one row that legitimately shows a dash.
        reportHit({ method: 'GET', url: 'https://offline.example.com/v1/ping', outcome: 'passed' });

        // DevTools reported this one with status 0 — blocked, or captured before
        // it answered — while the interceptor got the real 200. The merged row
        // must show 200, not a dash.
        net._emit(entry('GET', 'https://half-reported.example.com/v1/items', 0, '', 'xhr', 'application/json'));
        reportHit({ method: 'GET', url: 'https://half-reported.example.com/v1/items', outcome: 'passed', status: 200 });

        broadcast({ type: 'bridge-status', connected: true });
      }, 300);
    </script>

    <script type="module">
      // The panel's JS and CSS filenames are content-hashed, so they are
      // discovered from the built panel.html rather than hard-coded. Loading
      // happens here, after the `chrome` stub above is in place — the panel
      // touches chrome.devtools as soon as its module body runs.
      const base = '/dist/devtools/';
      const html = await (await fetch(base + 'panel.html')).text();
      const doc = new DOMParser().parseFromString(html, 'text/html');

      // Vite emits root-absolute `/assets/...` paths, which are correct inside
      // the packed extension but land one directory too high here, where the
      // build output is served under /dist.
      const resolve = (raw) => {
        const path = new URL(raw, location.origin + base).pathname;
        return path.startsWith('/dist/') ? path : '/dist' + path;
      };

      for (const link of doc.querySelectorAll('link[rel="stylesheet"]')) {
        const el = document.createElement('link');
        el.rel = 'stylesheet';
        el.href = resolve(link.getAttribute('href'));
        document.head.appendChild(el);
      }

      for (const script of doc.querySelectorAll('script[type="module"][src]')) {
        const el = document.createElement('script');
        el.type = 'module';
        el.src = resolve(script.getAttribute('src'));
        document.body.appendChild(el);
      }
    </script>
  </body>
</html>
