<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>pending</title>
  </head>
  <body>
    <h1>Fail-open check</h1>
    <pre id="out">running… (expect ~2s)</pre>

    <!-- Interceptor loaded with NO relay and therefore NO config, ever. -->
    <script src="/dist/injected/intercept.js"></script>

    <script>
      // The page must still work. If the timeout logic were missing or wrong, this
      // fetch would hang forever and the page would be broken by the extension.
      const started = Date.now();
      fetch('/api/real')
        .then((r) => r.json())
        .then((body) => {
          const elapsed = Date.now() - started;
          const ok = body.via === 'network' && elapsed < 5000;
          document.getElementById('out').textContent =
            `${ok ? 'PASS' : 'FAIL'} — passthrough after ${elapsed}ms, body=${JSON.stringify(body)}`;
          document.title = ok ? 'ALL PASS' : 'FAILED';
        })
        .catch((error) => {
          document.getElementById('out').textContent = 'FAIL — ' + error;
          document.title = 'FAILED';
        });

      setTimeout(() => {
        if (document.title === 'pending') document.title = 'HUNG';
      }, 6000);
    </script>
  </body>
</html>
