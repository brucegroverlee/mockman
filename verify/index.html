<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>pending</title>
  </head>
  <body>
    <h1>Mockman — interception engine verification</h1>
    <pre id="out">running…</pre>

    <!-- The real built artefact, loaded exactly as a MAIN-world content script would be. -->
    <script src="/dist/injected/intercept.js"></script>

    <script>
      // Stand in for the ISOLATED-world relay: hand the interceptor its config.
      // This is the CompiledMock shape from shared/src/types.ts.
      const mock = (over) => ({
        mockId: 'm1',
        path: 'test / m1',
        match: { method: 'GET', urlPattern: '*/api/users*', patternKind: 'glob' },
        response: {
          status: 200,
          headers: { 'x-mocked-by': 'mockman' },
          body: '{"mocked":true}',
          bodyKind: 'json',
          delayMs: 0,
        },
        ...over,
      });

      const config = {
        active: true,
        mocks: [
          mock({}),
          mock({
            mockId: 'm2',
            path: 'test / teapot',
            match: { method: 'GET', urlPattern: '*/api/teapot', patternKind: 'glob' },
            response: { status: 418, headers: {}, body: 'short and stout', bodyKind: 'text', delayMs: 0 },
          }),
          mock({
            mockId: 'm3',
            path: 'test / xhr',
            match: { method: 'GET', urlPattern: '*/api/xhr-mocked', patternKind: 'glob' },
            response: {
              status: 200,
              headers: { 'x-via': 'xhr-mock' },
              body: '{"xhr":"mocked"}',
              bodyKind: 'json',
              delayMs: 0,
            },
          }),
          mock({
            mockId: 'm4',
            path: 'test / post-only',
            match: { method: 'POST', urlPattern: '*/api/method-test', patternKind: 'glob' },
            response: { status: 200, headers: {}, body: '{"post":true}', bodyKind: 'json', delayMs: 0 },
          }),

          // --- v2: artificial latency ---
          mock({
            mockId: 'm5',
            path: 'test / slow',
            match: { method: 'GET', urlPattern: '*/api/slow', patternKind: 'glob' },
            response: { status: 200, headers: {}, body: '{"slow":true}', bodyKind: 'json', delayMs: 250 },
          }),

          // --- v2: request-body matching ---
          // Narrow first, catch-all second: first-match-wins means the order of
          // these two IS the behaviour being tested.
          mock({
            mockId: 'm6',
            path: 'test / body-save',
            match: {
              method: 'POST',
              urlPattern: '*/api/body-test',
              patternKind: 'glob',
              body: { mode: 'json-subset', value: '{"action":"save"}' },
            },
            response: { status: 200, headers: {}, body: '{"matched":"save"}', bodyKind: 'json', delayMs: 0 },
          }),
          mock({
            mockId: 'm7',
            path: 'test / body-any',
            match: { method: 'POST', urlPattern: '*/api/body-test', patternKind: 'glob' },
            response: { status: 200, headers: {}, body: '{"matched":"any"}', bodyKind: 'json', delayMs: 0 },
          }),
          // --- a status the Response constructor cannot build ---
          // Reachable from the panel (an emptied status field once yielded 0)
          // and from MCP/import (1xx passes every schema). It must fall back to
          // the network, not reject the page's fetch.
          mock({
            mockId: 'm9',
            path: 'test / bad-status',
            match: { method: 'GET', urlPattern: '*/api/bad-status', patternKind: 'glob' },
            response: { status: 0, headers: {}, body: 'never delivered', bodyKind: 'text', delayMs: 0 },
          }),

          mock({
            mockId: 'm8',
            path: 'test / body-required',
            match: {
              method: 'POST',
              urlPattern: '*/api/body-required',
              patternKind: 'glob',
              body: { mode: 'contains', value: 'needle' },
            },
            response: { status: 200, headers: {}, body: '{"matched":true}', bodyKind: 'json', delayMs: 0 },
          }),
        ],
      };

      const hits = [];
      document.addEventListener('mockman:hit', (e) => hits.push(e.detail.hit));
      document.dispatchEvent(
        new CustomEvent('mockman:config', { detail: { config } }),
      );

      const results = [];
      const check = (name, pass, detail) => results.push({ name, pass, detail });

      function xhrGet(url) {
        return new Promise((resolve) => {
          const order = [];
          const xhr = new XMLHttpRequest();
          xhr.open('GET', url);
          xhr.onreadystatechange = () => order.push('rs' + xhr.readyState);
          xhr.onload = () => order.push('load');
          xhr.onloadend = () => {
            order.push('loadend');
            resolve({
              status: xhr.status,
              statusText: xhr.statusText,
              responseText: xhr.responseText,
              allHeaders: xhr.getAllResponseHeaders(),
              oneHeader: xhr.getResponseHeader('x-via'),
              responseURL: xhr.responseURL,
              order,
            });
          };
          xhr.send();
        });
      }

      (async () => {
        // --- fetch: mocked ---
        const r1 = await fetch('/api/users?page=1');
        const b1 = await r1.json();
        check('fetch mocked: status 200', r1.status === 200, r1.status);
        check('fetch mocked: body substituted', b1.mocked === true, JSON.stringify(b1));
        check(
          'fetch mocked: custom header present',
          r1.headers.get('x-mocked-by') === 'mockman',
          r1.headers.get('x-mocked-by'),
        );
        check(
          'fetch mocked: content-type defaulted to json',
          (r1.headers.get('content-type') || '').includes('application/json'),
          r1.headers.get('content-type'),
        );
        check('fetch mocked: url preserved', r1.url.includes('/api/users'), r1.url);

        // --- fetch: passthrough reaches the real network ---
        const r2 = await fetch('/api/real');
        const b2 = await r2.json();
        check('fetch passthrough: real response', b2.via === 'network', JSON.stringify(b2));

        // --- fetch: non-200 status and text body ---
        const r3 = await fetch('/api/teapot');
        check('fetch mocked: status 418', r3.status === 418, r3.status);
        check('fetch mocked: statusText derived', r3.statusText === "I'm a Teapot", r3.statusText);
        check('fetch mocked: text body', (await r3.text()) === 'short and stout');

        // --- fetch: method must match ---
        const r4 = await fetch('/api/method-test'); // GET, mock is POST-only
        check('fetch: method mismatch passes through', r4.status === 404, r4.status);

        // --- XHR: mocked ---
        const x1 = await xhrGet('/api/xhr-mocked');
        check('xhr mocked: status', x1.status === 200, x1.status);
        check('xhr mocked: responseText', x1.responseText === '{"xhr":"mocked"}', x1.responseText);
        check('xhr mocked: getResponseHeader', x1.oneHeader === 'xhr-mock', x1.oneHeader);
        check(
          'xhr mocked: getAllResponseHeaders',
          x1.allHeaders.includes('x-via: xhr-mock'),
          x1.allHeaders,
        );
        check('xhr mocked: responseURL set', x1.responseURL.includes('/api/xhr-mocked'), x1.responseURL);
        check(
          'xhr mocked: event order rs2,rs3,rs4,load,loadend',
          x1.order.join(',') === 'rs2,rs3,rs4,load,loadend',
          x1.order.join(','),
        );

        // --- XHR: passthrough ---
        const x2 = await xhrGet('/api/xhr-real');
        check('xhr passthrough: real status 201', x2.status === 201, x2.status);
        check('xhr passthrough: real body', x2.responseText.includes('xhrReal'), x2.responseText);

        // --- delayMs ---
        const t0 = performance.now();
        const r5 = await fetch('/api/slow');
        const elapsed = performance.now() - t0;
        check('delay: response still correct', (await r5.json()).slow === true);
        // Generous lower bound: setTimeout only guarantees "at least".
        check('delay: waited ~250ms before responding', elapsed >= 200, Math.round(elapsed) + 'ms');

        // --- a mock that cannot be built must fail OPEN ---
        // The Response constructor rejects any status outside 200-599. If that
        // RangeError escaped, the page's own fetch would reject — so this must
        // reach the network (404 here) rather than throw.
        let badStatusThrew = null;
        let r6 = null;
        try {
          r6 = await fetch('/api/bad-status');
        } catch (error) {
          badStatusThrew = String(error);
        }
        check('unbuildable response: does not reject the page fetch', badStatusThrew === null, badStatusThrew);
        check('unbuildable response: falls through to the network', r6 && r6.status === 404, r6 && r6.status);
        check(
          'unbuildable response: logged as passed, not mocked',
          !hits.some((h) => h.url.includes('/api/bad-status') && h.outcome === 'mocked'),
          JSON.stringify(hits.filter((h) => h.url.includes('/api/bad-status'))),
        );

        // --- request body matching ---
        const post = async (url, body) => {
          const r = await fetch(url, { method: 'POST', body });
          return { status: r.status, text: await r.text() };
        };

        const bodySave = await post('/api/body-test', '{"action":"save","ts":123}');
        check(
          'body match: json-subset wins over the catch-all',
          JSON.parse(bodySave.text).matched === 'save',
          bodySave.text,
        );

        const bodyOther = await post('/api/body-test', '{"action":"delete"}');
        check(
          'body match: non-matching body falls through to the catch-all',
          JSON.parse(bodyOther.text).matched === 'any',
          bodyOther.text,
        );

        const bodyHit = await post('/api/body-required', 'a needle in there');
        check('body match: contains matches', JSON.parse(bodyHit.text).matched === true, bodyHit.text);

        const bodyMiss = await post('/api/body-required', 'nothing here');
        check(
          'body match: non-matching body reaches the network',
          bodyMiss.status === 404,
          bodyMiss.status,
        );

        // An unreadable body must NOT satisfy a body matcher — otherwise a
        // narrow mock would quietly behave like a catch-all.
        const unreadable = await fetch('/api/body-required', {
          method: 'POST',
          body: new Blob(['needle']),
        });
        check(
          'body match: an unreadable body fails closed',
          unreadable.status === 404,
          unreadable.status,
        );

        // XHR bodies are readable synchronously, so they must match.
        const xhrBody = await new Promise((resolve) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/api/body-required');
          xhr.onloadend = () => resolve({ status: xhr.status, text: xhr.responseText });
          xhr.send('a needle in there');
        });
        check('body match: works for XHR too', xhrBody.status === 200, JSON.stringify(xhrBody));

        // --- hit reporting ---
        check(
          'hits reported for mocked requests',
          hits.some((h) => h.outcome === 'mocked' && h.url.includes('/api/users')),
          JSON.stringify(hits.filter((h) => h.outcome === 'mocked').map((h) => h.url)),
        );
        check(
          'hits carry the mock breadcrumb path',
          hits.some((h) => h.outcome === 'mocked' && h.path === 'test / m1'),
          JSON.stringify(hits.filter((h) => h.outcome === 'mocked').map((h) => h.path)),
        );
        // --- cross-origin, with a real CORS preflight ---
        // The page is on 127.0.0.1, so localhost is a different origin. The
        // custom header forces the browser to send an OPTIONS preflight first —
        // the exact shape of a real app calling its API on another port, and the
        // one where the interceptor must still come back with a status.
        const CROSS = `http://localhost:${location.port}`;
        const xo = await fetch(`${CROSS}/api/cors`, { headers: { 'x-force-preflight': '1' } });
        check('cross-origin passthrough: reaches the network', (await xo.json()).crossOrigin === true, xo.status);
        check('cross-origin passthrough: status visible to the page', xo.status === 200, xo.status);

        const xoHit = hits.find((h) => h.url.includes('/api/cors') && !h.url.includes('404') && h.outcome === 'passed');
        check('cross-origin passed hit carries its status', xoHit?.status === 200, JSON.stringify(xoHit));
        check('cross-origin passed hit is not logged as OPTIONS', xoHit?.method === 'GET', JSON.stringify(xoHit));

        const xo404 = await fetch(`${CROSS}/api/cors-404`, {
          method: 'POST',
          headers: { 'x-force-preflight': '1', 'content-type': 'application/json' },
          body: '{}',
        });
        const xo404Hit = hits.find((h) => h.url.includes('/api/cors-404') && h.outcome === 'passed');
        check('cross-origin POST hit carries a non-200 status', xo404Hit?.status === 404, JSON.stringify(xo404Hit));
        check('cross-origin POST hit keeps its method', xo404Hit?.method === 'POST', JSON.stringify(xo404Hit));
        void xo404;

        // A passed hit must carry the real response status. The panel lists
        // these rows beside ones DevTools reported, so a missing status shows up
        // as a blank column next to populated ones.
        const passedReal = hits.find((h) => h.outcome === 'passed' && h.url.includes('/api/real'));
        check('passed hits carry the real status', passedReal?.status === 200, JSON.stringify(passedReal));

        const passed404 = hits.find((h) => h.outcome === 'passed' && h.url.includes('/api/method-test'));
        check('passed hits carry a non-200 status too', passed404?.status === 404, JSON.stringify(passed404));

        const passedXhr = hits.find((h) => h.outcome === 'passed' && h.url.includes('/api/xhr-real'));
        check('passed XHR hits carry their status', passedXhr?.status === 201, JSON.stringify(passedXhr));

        // Timestamped when the request went out, not when it came back — the
        // panel pairs these against DevTools entries within a few seconds.
        check(
          'a passed hit is timestamped at request time',
          passedReal !== undefined && passedReal.timestamp <= Date.now() && Date.now() - passedReal.timestamp < 60000,
          String(passedReal?.timestamp),
        );

        check(
          'hits reported for passed requests',
          hits.some((h) => h.outcome === 'passed' && h.url.includes('/api/real')),
          JSON.stringify(hits.filter((h) => h.outcome === 'passed').map((h) => h.url)),
        );

        const failed = results.filter((r) => !r.pass);
        const summary =
          `${results.length - failed.length}/${results.length} passed\n\n` +
          results
            .map((r) => `${r.pass ? 'PASS' : 'FAIL'}  ${r.name}` + (r.pass ? '' : `\n        got: ${r.detail}`))
            .join('\n');

        document.getElementById('out').textContent = summary;
        document.title = failed.length === 0 ? 'ALL PASS' : `${failed.length} FAILED`;
        console.log(summary);
      })().catch((error) => {
        document.getElementById('out').textContent = 'threw: ' + error.stack;
        document.title = 'THREW';
        console.error(error);
      });
    </script>
  </body>
</html>
